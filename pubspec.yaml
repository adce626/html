name: sama_app
description: "سما انوار الهدى للخدمات العامة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1
  firebase_crashlytics: ^4.3.0
  flutter_local_notifications: ^18.0.1

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.5.3

  # Connectivity
  connectivity_plus: ^6.1.3

  # URL Launcher
  url_launcher: ^6.3.1

  # Image
  image_picker: ^1.1.2

  # Icons
  cupertino_icons: ^1.0.8

  # Speech to text
  speech_to_text: ^7.0.0

  # Intl (dates, RTL)
  intl: ^0.20.2

  # Animations
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  disable: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/license.webp
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
